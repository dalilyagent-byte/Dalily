<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>دليلي — محادثة المدير</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;height:100vh}.app{max-width:900px;margin:auto;height:100vh;display:flex;flex-direction:column;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}.brand{font-size:25px;font-weight:900}.state{font-size:12px;color:#86efac;border:1px solid #14532d;border-radius:999px;padding:7px 10px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.nav a{color:#cbd5e1;text-decoration:none;border:1px solid #334155;border-radius:11px;padding:8px 11px;font-size:13px}.chat{flex:1;overflow:auto;background:#0a1627;border:1px solid #22314b;border-radius:20px;padding:14px}.msg{max-width:86%;padding:11px 13px;border-radius:16px;margin:9px 0;line-height:1.7;white-space:pre-wrap}.me{background:#172554;margin-right:auto}.dalily{background:#10261f;margin-left:auto}.thinking{color:#94a3b8}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding-top:10px}.composer textarea{resize:none;min-height:52px;max-height:130px;background:#0a1627;color:#fff;border:1px solid #334155;border-radius:15px;padding:13px;font:inherit}.composer button{border:0;border-radius:14px;padding:0 18px;font-weight:900;background:#fff;color:#0f172a}.quick{display:flex;gap:7px;overflow:auto;padding:9px 0}.quick button{white-space:nowrap;border:1px solid #334155;background:#101c30;color:#cbd5e1;border-radius:999px;padding:8px 11px}.note{color:#64748b;font-size:12px;padding:5px 2px}@media(max-width:600px){.app{padding:9px}.msg{max-width:92%}.composer{grid-template-columns:1fr}.composer button{padding:13px}}</style></head><body><main class="app"><div class="top"><div class="brand">DALILY <span style="font-size:14px;color:#94a3b8">مدير أعمالك</span></div><div id="state" class="state">متصل</div></div><div class="nav"><a href="/manager.html">مركز القيادة</a><a href="/">الأعمال</a><a href="/plan.html">الخطة</a></div><div class="quick"><button data-q="وش وضع أعمالنا الآن؟">وضع الأعمال</button><button data-q="وش الأولوية اليوم؟">أولوية اليوم</button><button data-q="وش أفضل فرصة وليش؟">أفضل فرصة</button><button data-q="هل عندك قرار يحتاج موافقتي؟">قراراتي</button></div><section id="chat" class="chat"><div class="msg dalily">هلا، أنا دليلي. أنا مدير أعمالك الرقمي. أقدر أراجع الفرص والخطة الحالية، أرتب لك الأولويات، وأرفع لك القرارات اللي تحتاج موافقتك. وش تبي نبدأ فيه؟</div></section><form id="form" class="composer"><textarea id="input" placeholder="اكتب لدليلي..." required></textarea><button id="send">إرسال</button></form><div class="note">دليلي لا ينفذ دفعاً أو عقداً أو التزاماً قانونياً إلا عبر قناة تنفيذ مصرح بها وبعد الموافقة المطلوبة.</div></main><script>const $=x=>document.getElementById(x);let plan=null,opportunities=[],history=[];async function loadContext(){try{const [p,o]=await Promise.all([fetch('/execution-plan.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null),fetch('/opportunities.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)]);plan=p;opportunities=o?.items||[]}catch(e){}}loadContext();function add(role,text,cls=''){const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'dalily')+(cls?' '+cls:'');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}async function sendMessage(q){q=q.trim();if(!q)return;add('user',q);history.push({role:'user',content:q});$('input').value='';$('send').disabled=true;$('state').textContent='يفكر...';const wait=add('assistant','دليلي يحلل الطلب...','thinking');try{let lastDecision=null;try{lastDecision=JSON.parse(localStorage.getItem('dalily-last-decision')||'null')}catch{}const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q,history:history.slice(0,-1),context:{plan,opportunities,lastDecision}})});const data=await r.json();wait.remove();if(!r.ok)throw new Error(data.error||'تعذر الاتصال');const reply=data.reply||'ما وصلني رد واضح.';add('assistant',reply);history.push({role:'assistant',content:reply});if(history.length>20)history=history.slice(-20);$('state').textContent='متصل'}catch(e){wait.remove();add('assistant','صار عندي تعثر في الاتصال بمحرك الذكاء: '+e.message);$('state').textContent='تعذر الاتصال'}finally{$('send').disabled=false;$('input').focus()}}$('form').onsubmit=e=>{e.preventDefault();sendMessage($('input').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});</script></body></html>
