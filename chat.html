<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>دليلي — مدير أعمالك</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;height:100vh}.app{max-width:900px;margin:auto;height:100vh;display:flex;flex-direction:column;padding:12px}.top,.nav,.quick,.authbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-size:25px;font-weight:900}.state{font-size:12px;color:#86efac;border:1px solid #14532d;border-radius:999px;padding:7px 10px}.nav{margin:9px 0}.nav a,.quick button,.authbar button{color:#cbd5e1;text-decoration:none;border:1px solid #334155;background:#101c30;border-radius:11px;padding:8px 11px;font-size:13px}.authbar span{font-size:12px;color:#94a3b8}.quick{overflow:auto;padding:8px 0}.quick button{white-space:nowrap}.chat{flex:1;overflow:auto;background:#0a1627;border:1px solid #22314b;border-radius:20px;padding:14px}.msg{max-width:88%;padding:11px 13px;border-radius:16px;margin:9px 0;line-height:1.7;white-space:pre-wrap}.me{background:#172554;margin-right:auto}.dalily{background:#10261f;margin-left:auto}.system{background:#1f2937;color:#cbd5e1}.thinking{color:#94a3b8}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding-top:10px}.composer textarea{resize:none;min-height:52px;background:#0a1627;color:#fff;border:1px solid #334155;border-radius:15px;padding:13px;font:inherit}.composer button{border:0;border-radius:14px;padding:0 18px;font-weight:900}.note{color:#64748b;font-size:12px;padding:5px 2px}@media(max-width:600px){.composer{grid-template-columns:1fr}.composer button{padding:13px}}</style></head><body><main class="app"><div class="top"><div class="brand">DALILY <small style="font-size:14px;color:#94a3b8">مدير أعمالك</small></div><div id="state" class="state">متصل</div></div><div class="nav"><a href="/manager.html">مركز القيادة</a><a href="/">الأعمال</a><a href="/plan.html">الخطة</a></div><div class="authbar"><button id="login">تسجيل الدخول Google</button><button id="logout" style="display:none">تسجيل الخروج</button><span id="who">غير مسجل — التنفيذ داخل الحساب يحتاج دخول</span></div><div class="quick"><button data-q="اعرض مهامي">مهامي</button><button data-q="اعرض مشاريعي">مشاريعي</button><button data-q="وش الأولوية اليوم؟">أولوية اليوم</button><button data-q="وش أفضل فرصة وليش؟">أفضل فرصة</button></div><section id="chat" class="chat"><div class="msg dalily">هلا. أنا دليلي، مدير أعمالك الرقمي. الحين أقدر أنشئ المهام والمشاريع، أعرضها، وأنجز أو أحذف المهام من نفس المحادثة.</div></section><form id="form" class="composer"><textarea id="input" placeholder="مثال: أضف مهمة التواصل مع 5 عملاء" required></textarea><button id="send">إرسال</button></form><div class="note">الإجراءات المالية والقانونية لا تُنفذ تلقائياً.</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp,getDocs,query,orderBy,updateDoc,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyAJbfBSoquKOGBzmW8JzdtkuD97Nc10OYI',authDomain:'dalily-15fbb.firebaseapp.com',projectId:'dalily-15fbb',storageBucket:'dalily-15fbb.firebasestorage.app',messagingSenderId:'367242706687',appId:'1:367242706687:web:c94480475dff2385a496ca',measurementId:'G-1VT3HVTD3Y'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=x=>document.getElementById(x);let user=null,plan=null,opportunities=[],history=[];function add(role,text,cls=''){const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'dalily')+(cls?' '+cls:'');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}onAuthStateChanged(auth,u=>{user=u;$('login').style.display=u?'none':'inline-block';$('logout').style.display=u?'inline-block':'none';$('who').textContent=u?`مسجل: ${u.email||u.displayName||'الحساب'}`:'غير مسجل — التنفيذ داخل الحساب يحتاج دخول'});$('login').onclick=()=>signInWithPopup(auth,provider).catch(e=>add('assistant','تعذر تسجيل الدخول: '+e.message,'system'));$('logout').onclick=()=>signOut(auth);async function loadContext(){try{const[p,o]=await Promise.all([fetch('/execution-plan.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null),fetch('/opportunities.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)]);plan=p;opportunities=o?.items||[]}catch{}}loadContext();async function items(kind){const s=await getDocs(query(collection(db,'users',user.uid,kind),orderBy('createdAt','desc')));return s.docs.map(x=>({id:x.id,...x.data()}))}function findItem(a,q,field){q=q.toLowerCase();return a.find(x=>String(x[field]||'').toLowerCase().includes(q))}async function runAction(a){if(!a)return null;if(!user)return'الطلب جاهز، لكن التنفيذ داخل الحساب يحتاج تسجيل الدخول بحساب Google أولاً.';if(a.type==='create_task'){await addDoc(collection(db,'users',user.uid,'tasks'),{title:a.title,projectId:'',done:false,createdAt:serverTimestamp(),source:'dalily-chat'});return`تم: أضفت المهمة «${a.title}».`}if(a.type==='create_project'){await addDoc(collection(db,'users',user.uid,'projects'),{name:a.name,createdAt:serverTimestamp(),source:'dalily-chat'});return`تم: أنشأت المشروع «${a.name}».`}if(a.type==='list_tasks'){const x=await items('tasks');return x.length?'مهامك الحالية:\n'+x.slice(0,15).map((t,i)=>`${i+1}. ${t.done?'✓':'○'} ${t.title}`).join('\n'):'ما عندك مهام حالياً.'}if(a.type==='list_projects'){const x=await items('projects');return x.length?'مشاريعك الحالية:\n'+x.slice(0,15).map((p,i)=>`${i+1}. ${p.name}`).join('\n'):'ما عندك مشاريع حالياً.'}if(a.type==='complete_task'||a.type==='delete_task'){const x=await items('tasks'),t=findItem(x,a.query,'title');if(!t)return`ما لقيت مهمة تطابق «${a.query}».`;if(a.type==='complete_task'){await updateDoc(doc(db,'users',user.uid,'tasks',t.id),{done:true,completedAt:serverTimestamp()});return`تم إنجاز المهمة «${t.title}».`}await deleteDoc(doc(db,'users',user.uid,'tasks',t.id));return`تم حذف المهمة «${t.title}».`}return null}async function sendMessage(q){q=q.trim();if(!q)return;add('user',q);history.push({role:'user',content:q});$('input').value='';$('send').disabled=true;$('state').textContent='يفكر...';const wait=add('assistant','دليلي يحلل الطلب...','thinking');try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q,history:history.slice(0,-1),context:{plan,opportunities}})}),data=await r.json();wait.remove();if(!r.ok)throw new Error(data.error||'تعذر الاتصال');add('assistant',data.reply||'تم استلام الطلب.');if(data.action){const done=await runAction(data.action);if(done)add('assistant',done,'system')}$('state').textContent=data.mode==='action'?'تنفيذ مباشر':data.mode==='ai'?'ذكاء متصل':'وضع احتياطي'}catch(e){wait.remove();add('assistant','صار تعثر: '+e.message,'system');$('state').textContent='تعذر الاتصال'}finally{$('send').disabled=false;$('input').focus()}}$('form').onsubmit=e=>{e.preventDefault();sendMessage($('input').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});</script></body></html>
