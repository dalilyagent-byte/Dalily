'+googleAccessToken}});const d=await r.json();if(!r.ok){if(r.status===401){googleAccessToken='';sessionStorage.removeItem('dalilyGoogleAccess');throw Error('انتهت صلاحية Google. فعّل صلاحيات المدير مرة ثانية.')}throw Error(d.error?.message||'تعذر الوصول إلى خدمة Google');}return d}function header(msg,name){return msg.payload?.headers?.find(h=>h.name.toLowerCase()===name.toLowerCase())?.value||''}async function latestEmails(n=3){const list=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults='+n+'&labelIds=INBOX');if(!list.messages?.length)return 'ما لقيت رسائل في صندوق الوارد.';const out=[];for(const m of list.messages){const x=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+m.id+'?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date');out.push(`• ${header(x,'Subject')||'(بدون عنوان)'}\nمن: ${header(x,'From')||'غير معروف'}\n${x.snippet||''}`)}return 'آخر '+out.length+' رسائل في بريدك:\n\n'+out.join('\n\n')}async function upcomingEvents(){const now=new Date().toISOString(),url='https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin='+encodeURIComponent(now)+'&maxResults=5&singleEvents=true&orderBy=startTime';const d=await gfetch(url);if(!d.items?.length)return 'ما عندك مواعيد قادمة.';return 'أقرب مواعيدك:\n\n'+d.items.map(e=>{const when=e.start?.dateTime||e.start?.date||'';return '• '+(e.summary||'(بدون عنوان)')+'\n'+when}).join('\n\n')}async function contacts(){const d=await gfetch('https://people.googleapis.com/v1/people/me/connections?pageSize=10&personFields=names,emailAddresses,phoneNumbers');if(!d.connections?.length)return 'ما لقيت جهات اتصال.';return 'أول جهات الاتصال:\n\n'+d.connections.slice(0,10).map(p=>{const n=p.names?.[0]?.displayName||'بدون اسم',em=p.emailAddresses?.[0]?.value||'',ph=p.phoneNumbers?.[0]?.value||'';return '• '+n+(ph?'\n'+ph:'')+(em?'\n'+em:'')}).join('\n\n')}async function driveFiles(){const d=await gfetch('https://www.googleapis.com/drive/v3/files?pageSize=5&orderBy=modifiedTime%20desc&fields=files(id,name,mimeType,modifiedTime,webViewLink)');if(!d.files?.length)return 'ما لقيت ملفات في Drive.';return 'آخر ملفات Drive:\n\n'+d.files.map(f=>'• '+f.name+'\n'+(f.modifiedTime||'')).join('\n\n')}async function ask(q){if(!q.trim())return;add(q,'me');history.push({role:'user',text:q.trim()});saveHistory();input.value='';send.disabled=true;const t=add('…');try{const isCall=/^(?:دليلي\s+)?(?:اتصل|اتّصل|كلم|كلّم)\s+(?:على\s+)?(?:\+?9665\d{8}|05\d{8})/i.test(q.trim());if(!isCall){if(/(?:آخر|احدث|أحدث).*?(?:رسائل|ايميلات|إيميلات)|(?:اعرض|ورني).*?(?:البريد|الايميل|الإيميل)/i.test(q)){const m=q.match(/(\d+)/);t.textContent=await latestEmails(Math.min(Number(m?.[1]||3),10));return}if(/(?:موعد|مواعيد|تقويم|جدولي)/i.test(q)){t.textContent=await upcomingEvents();return}if(/(?:جهات الاتصال|عملائي|العملاء|ارقام|أرقام)/i.test(q)){t.textContent=await contacts();return}if(/(?:drive|درايف|ملفاتي|الملفات)/i.test(q)){t.textContent=await driveFiles();return}}if(!user)throw Error('سجّل دخول Google أولاً.');const token=await user.getIdToken();const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message:q,messages:history.slice(-24),pushSubscription:isCall&&Notification.permission==='granted'?await getPushSubscription().catch(()=>null):null})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر الرد');let reply=d.reply||'تم.';if(d.mode==='action'&&d.action)reply=await executeDalilyAction(d.action);t.textContent=reply;if(d.provider){t.dataset.provider=d.provider;t.title='المحرك: '+d.provider;}history.push({role:'model',text:t.textContent});saveHistory();if(d.mode==='voice'&&d.callId)startCallReport(d.callId)}catch(e){t.textContent=e.message}finally{send.disabled=false;chat.scrollTop=chat.scrollHeight}}const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));let reportPolling=false;async function startCallReport(callId){if(!callId||reportPolling)return;reportPolling=true;localStorage.setItem('dalilyPendingCall',callId);const reportMessage=add('بانتظار انتهاء المكالمة لإعداد التقرير…');try{for(let attempt=0;attempt<60;attempt++){await wait(attempt?7000:5000);if(!user)continue;const token=await user.getIdToken();const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({reportCallId:callId})});const data=await response.json();if(data.done){reportMessage.textContent=data.reply||'انتهت المكالمة.';history.push({role:'model',text:reportMessage.textContent});saveHistory();localStorage.removeItem('dalilyPendingCall');await showNotification('تقرير مكالمة دليلي',reportMessage.textContent.slice(0,180));return}}reportMessage.textContent='تأخر تقرير الاتصال. اكتب: وش صار في آخر مكالمة؟';}catch(error){reportMessage.textContent='تعذر تحديث تقرير الاتصال تلقائياً: '+error.message}finally{reportPolling=false}}gmailTest.onclick=()=>ask('اعرض آخر 3 رسائل في بريدي');calendarTest.onclick=()=>ask('اعرض مواعيدي القادمة');contactsTest.onclick=()=>ask('اعرض جهات الاتصال');driveTest.onclick=()=>ask('اعرض آخر ملفاتي في Drive');form.onsubmit=e=>{e.preventDefault();ask(input.value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
