<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f6f8fb;color:#10233f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:#fff}.top{padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #e8edf3;background:#fff}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.identity{display:flex;align-items:center;gap:9px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#17335f,#071a35);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;position:relative}.logo:after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#54e62f;right:4px;bottom:4px}.title{font-size:18px;font-weight:900}.state{font-size:11px;padding:6px 9px;border-radius:999px;background:#e7f6ef;color:#147a5a}.tools{display:none;gap:6px;margin-top:8px;overflow-x:auto}.tools.show{display:flex}.tools button,.tools a{flex:0 0 auto;border:1px solid #d9e2ec;background:#fff;color:#29445f;border-radius:11px;padding:7px 10px;font-size:12px;font-weight:700;text-decoration:none}.more{border:0;background:#eef3f8;color:#29445f;width:34px;height:34px;border-radius:10px;font-size:20px}.loginbar{display:flex;align-items:center;gap:7px;margin-top:7px}.loginbar button{border:0;border-radius:10px;padding:7px 10px;font-weight:800}.login{background:#10233f;color:#fff}.logout{background:#eef2f6;color:#334155}.who{font-size:11px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#f7f9fc;display:flex;flex-direction:column;gap:8px}.msg{max-width:88%;padding:10px 12px;border-radius:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.me{align-self:flex-start;background:#0d4d7f;color:#fff;border-bottom-left-radius:5px}.dalily{align-self:flex-end;background:#fff;border:1px solid #dfe7ef;color:#20364f;border-bottom-right-radius:5px}.welcome{margin:auto 0;text-align:center;color:#718096;padding:18px}.welcome b{display:block;color:#20364f;font-size:18px;margin-bottom:5px}.composer{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e2e8f0;background:#fff}.composer textarea{height:47px;min-height:47px;max-height:94px;resize:none;border:1px solid #ccd8e4;border-radius:14px;padding:12px;font:inherit;font-size:16px;outline:none}.composer button{height:47px;min-width:62px;border:0;border-radius:14px;background:#0d4d7f;color:#fff;font-weight:900}.composer button:disabled{opacity:.55}
</style></head><body>
<main class="app"><header class="top"><div class="head"><div class="identity"><div class="logo">D</div><div class="title">دليلي</div></div><div style="display:flex;align-items:center;gap:7px"><div id="state" class="state">جاهز</div><button id="more" class="more" aria-label="المزيد">⋯</button></div></div><div id="tools" class="tools"><button data-q="عطني تقرير مدير الأعمال">التقرير</button><button data-q="وش المهمة التالية؟">التالي</button><button data-q="وش المطلوب مني؟">المطلوب مني</button><a href="/manager.html">الإدارة</a><a href="/">الأعمال</a></div><div id="loginbar" class="loginbar"><button id="login" class="login">دخول Google</button><button id="logout" class="logout" style="display:none">خروج</button><span id="who" class="who">سجّل الدخول مرة واحدة فقط</span></div></header><section id="chat" class="chat"><div class="welcome"><b>هلا، أنا دليلي</b>اكتب طلبك مباشرة.</div></section><form id="form" class="composer"><textarea id="input" placeholder="اكتب لدليلي…"></textarea><button id="send">إرسال</button></form></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth,GoogleAuthProvider,signInWithRedirect,signInWithPopup,getRedirectResult,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyAJbfBSoquKOGBzmW8JzdtkuD97Nc10OYI',authDomain:'dalily-15fbb.firebaseapp.com',projectId:'dalily-15fbb',storageBucket:'dalily-15fbb.firebasestorage.app',messagingSenderId:'367242706687',appId:'1:367242706687:web:c94480475dff2385a496ca',measurementId:'G-1VT3HVTD3Y'};
const auth=getAuth(initializeApp(firebaseConfig));await setPersistence(auth,browserLocalPersistence);const provider=new GoogleAuthProvider();
provider.addScope('https://www.googleapis.com/auth/gmail.modify');
provider.addScope('https://www.googleapis.com/auth/gmail.send');
provider.addScope('https://www.googleapis.com/auth/calendar');
provider.addScope('https://www.googleapis.com/auth/contacts');
provider.addScope('https://www.googleapis.com/auth/drive');
provider.setCustomParameters({prompt:'consent select_account',include_granted_scopes:'true'});
const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send'),state=document.getElementById('state'),login=document.getElementById('login'),logout=document.getElementById('logout'),who=document.getElementById('who'),loginbar=document.getElementById('loginbar'),tools=document.getElementById('tools');let user=null;function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
document.getElementById('more').onclick=()=>tools.classList.toggle('show');getRedirectResult(auth).catch(e=>add('تعذر تسجيل الدخول: '+e.message,'dalily'));onAuthStateChanged(auth,u=>{user=u;login.style.display=u?'none':'block';logout.style.display=u?'block':'none';who.textContent=u?(u.email||'متصل'):'سجّل الدخول مرة واحدة فقط';state.textContent=u?'متصل':'جاهز';if(u)loginbar.style.display='none'});login.onclick=async()=>{try{login.disabled=true;login.textContent='جاري الدخول…';if(standalone){await signInWithPopup(auth,provider)}else{await signInWithRedirect(auth,provider)}}catch(e){login.disabled=false;login.textContent='دخول Google';add('تعذر تسجيل الدخول: '+e.message,'dalily')}};logout.onclick=()=>signOut(auth);
async function ask(q){if(!q.trim())return;add(q,'me');input.value='';send.disabled=true;const t=add('…','dalily');try{if(!user)throw new Error('سجّل دخول Google أولاً.');const token=await user.getIdToken();const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message:q})});const data=await r.json();if(!r.ok)throw new Error(data.error||'تعذر الرد');t.textContent=data.reply||'تم.'}catch(e){t.textContent=e.message}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}}form.onsubmit=e=>{e.preventDefault();ask(input.value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{tools.classList.remove('show');ask(b.dataset.q)});
</script></body></html>
