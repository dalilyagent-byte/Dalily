<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d4d7f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dalily"><link rel="apple-touch-icon" href="/dalily-icon-v2.png?v=10"><title>Dalily</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;background:#f6f8fb;color:#10233f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:#fff}.top{padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #e8edf3}.head{display:flex;align-items:center;justify-content:space-between}.identity{display:flex;align-items:center;gap:9px}.logo{width:38px;height:38px;border-radius:12px;background:#0b2345;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;position:relative}.logo:after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#54e62f;right:4px;bottom:4px}.title{font-size:18px;font-weight:900}.state{font-size:11px;padding:6px 9px;border-radius:999px;background:#e7f6ef;color:#147a5a}.more{border:0;background:#eef3f8;width:34px;height:34px;border-radius:10px;font-size:20px}.tools{display:none;gap:6px;margin-top:8px;overflow-x:auto}.tools.show{display:flex}.tools button,.tools a{flex:0 0 auto;border:1px solid #d9e2ec;background:#fff;color:#29445f;border-radius:11px;padding:7px 10px;font-size:12px;font-weight:700;text-decoration:none}.permit{background:#0d4d7f!important;color:#fff!important}.loginbar{display:flex;align-items:center;gap:7px;margin-top:7px}.loginbar button{border:0;border-radius:10px;padding:7px 10px;font-weight:800}.login{background:#10233f;color:#fff}.logout{background:#eef2f6}.who{font-size:11px;color:#64748b}.chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#f7f9fc;display:flex;flex-direction:column;gap:8px}.msg{max-width:90%;padding:10px 12px;border-radius:15px;line-height:1.55;white-space:pre-wrap;font-size:15px}.me{align-self:flex-start;background:#0d4d7f;color:#fff}.dalily{align-self:flex-end;background:#fff;border:1px solid #dfe7ef}.welcome{margin:auto;text-align:center;color:#718096}.welcome b{display:block;color:#20364f;font-size:18px}.composer{display:grid;grid-template-columns:1fr auto;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e2e8f0}.composer textarea{height:47px;resize:none;border:1px solid #ccd8e4;border-radius:14px;padding:12px;font:inherit;font-size:16px}.composer button{height:47px;min-width:62px;border:0;border-radius:14px;background:#0d4d7f;color:#fff;font-weight:900}</style></head><body><main class="app"><header class="top"><div class="head"><div class="identity"><div class="logo">D</div><div class="title">دليلي</div></div><div style="display:flex;align-items:center;gap:7px"><div id="state" class="state">جاهز</div><button id="more" class="more">⋯</button></div></div><div id="tools" class="tools"><button id="permissions" class="permit">تفعيل صلاحيات المدير</button><button id="gmailTest">آخر 3 رسائل</button><button id="calendarTest">المواعيد</button><button id="contactsTest">العملاء</button><button id="driveTest">Drive</button><button data-q="عطني تقرير مدير الأعمال">التقرير</button><a href="/manager.html">الإدارة</a></div><div id="loginbar" class="loginbar"><button id="login" class="login">دخول Google</button><button id="logout" class="logout" style="display:none">خروج</button><span id="who" class="who">سجّل الدخول مرة واحدة فقط</span></div></header><section id="chat" class="chat"><div class="welcome"><b>هلا، أنا دليلي</b>اكتب طلبك مباشرة.</div></section><form id="form" class="composer"><textarea id="input" placeholder="اكتب لدليلي…"></textarea><button id="send">إرسال</button></form></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithRedirect,signInWithPopup,getRedirectResult,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';const firebaseConfig={apiKey:'AIzaSyAJbfBSoquKOGBzmW8JzdtkuD97Nc10OYI',authDomain:'dalily-15fbb.firebaseapp.com',projectId:'dalily-15fbb',storageBucket:'dalily-15fbb.firebasestorage.app',messagingSenderId:'367242706687',appId:'1:367242706687:web:c94480475dff2385a496ca'};const auth=getAuth(initializeApp(firebaseConfig));await setPersistence(auth,browserLocalPersistence);function makeProvider(){const p=new GoogleAuthProvider();p.addScope('https://www.googleapis.com/auth/gmail.modify');p.addScope('https://www.googleapis.com/auth/gmail.send');p.addScope('https://www.googleapis.com/auth/calendar');p.addScope('https://www.googleapis.com/auth/contacts');p.addScope('https://www.googleapis.com/auth/drive');p.setCustomParameters({prompt:'consent select_account',include_granted_scopes:'true'});return p}const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send'),state=document.getElementById('state'),login=document.getElementById('login'),logout=document.getElementById('logout'),who=document.getElementById('who'),loginbar=document.getElementById('loginbar'),tools=document.getElementById('tools');let user=null,googleAccessToken=sessionStorage.getItem('dalilyGoogleAccess')||'';function add(t,c='dalily'){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}more.onclick=()=>tools.classList.toggle('show');const rr=await getRedirectResult(auth).catch(e=>{add('تعذر تسجيل الدخول: '+e.message);return null});if(rr){const c=GoogleAuthProvider.credentialFromResult(rr);if(c?.accessToken){googleAccessToken=c.accessToken;sessionStorage.setItem('dalilyGoogleAccess',googleAccessToken)}}onAuthStateChanged(auth,u=>{user=u;login.style.display=u?'none':'block';logout.style.display=u?'block':'none';who.textContent=u?(u.email||'متصل'):'سجّل الدخول مرة واحدة فقط';state.textContent=u?'متصل':'جاهز';if(u){loginbar.style.display='none';const pending=localStorage.getItem('dalilyPendingCall');if(pending)setTimeout(()=>startCallReport(pending),800)}});async function authorize(){try{if(standalone){const r=await signInWithPopup(auth,makeProvider());const c=GoogleAuthProvider.credentialFromResult(r);if(c?.accessToken){googleAccessToken=c.accessToken;sessionStorage.setItem('dalilyGoogleAccess',googleAccessToken);add('تم تفعيل صلاحيات Google لهذه الجلسة.')}}else{await signInWithRedirect(auth,makeProvider())}}catch(e){add('تعذر تفعيل الصلاحيات: '+e.message)}}login.onclick=authorize;permissions.onclick=authorize;logout.onclick=()=>{sessionStorage.removeItem('dalilyGoogleAccess');googleAccessToken='';signOut(auth)};async function gfetch(url){if(!googleAccessToken)throw Error('اضغط ⋯ ثم تفعيل صلاحيات المدير أولاً.');const r=await fetch(url,{headers:{Authorization:'Bearer '+googleAccessToken}});const d=await r.json();if(!r.ok){if(r.status===401){googleAccessToken='';sessionStorage.removeItem('dalilyGoogleAccess');throw Error('انتهت صلاحية Google. فعّل صلاحيات المدير مرة ثانية.')}throw Error(d.error?.message||'تعذر الوصول إلى خدمة Google');}return d}function header(msg,name){return msg.payload?.headers?.find(h=>h.name.toLowerCase()===name.toLowerCase())?.value||''}async function latestEmails(n=3){const list=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults='+n+'&labelIds=INBOX');if(!list.messages?.length)return 'ما لقيت رسائل في صندوق الوارد.';const out=[];for(const m of list.messages){const x=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+m.id+'?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date');out.push(`• ${header(x,'Subject')||'(بدون عنوان)'}\nمن: ${header(x,'From')||'غير معروف'}\n${x.snippet||''}`)}return 'آخر '+out.length+' رسائل في بريدك:\n\n'+out.join('\n\n')}async function upcomingEvents(){const now=new Date().toISOString(),url='https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin='+encodeURIComponent(now)+'&maxResults=5&singleEvents=true&orderBy=startTime';const d=await gfetch(url);if(!d.items?.length)return 'ما عندك مواعيد قادمة.';return 'أقرب مواعيدك:\n\n'+d.items.map(e=>{const when=e.start?.dateTime||e.start?.date||'';return '• '+(e.summary||'(بدون عنوان)')+'\n'+when}).join('\n\n')}async function contacts(){const d=await gfetch('https://people.googleapis.com/v1/people/me/connections?pageSize=10&personFields=names,emailAddresses,phoneNumbers');if(!d.connections?.length)return 'ما لقيت جهات اتصال.';return 'أول جهات الاتصال:\n\n'+d.connections.slice(0,10).map(p=>{const n=p.names?.[0]?.displayName||'بدون اسم',em=p.emailAddresses?.[0]?.value||'',ph=p.phoneNumbers?.[0]?.value||'';return '• '+n+(ph?'\n'+ph:'')+(em?'\n'+em:'')}).join('\n\n')}async function driveFiles(){const d=await gfetch('https://www.googleapis.com/drive/v3/files?pageSize=5&orderBy=modifiedTime%20desc&fields=files(id,name,mimeType,modifiedTime,webViewLink)');if(!d.files?.length)return 'ما لقيت ملفات في Drive.';return 'آخر ملفات Drive:\n\n'+d.files.map(f=>'• '+f.name+'\n'+(f.modifiedTime||'')).join('\n\n')}async function ask(q){if(!q.trim())return;add(q,'me');input.value='';send.disabled=true;const t=add('…');try{const isCall=/^(?:دليلي\s+)?(?:اتصل|اتّصل|كلم|كلّم)\s+(?:على\s+)?(?:\+?9665\d{8}|05\d{8})/i.test(q.trim());if(!isCall){if(/(?:آخر|احدث|أحدث).*?(?:رسائل|ايميلات|إيميلات)|(?:اعرض|ورني).*?(?:البريد|الايميل|الإيميل)/i.test(q)){const m=q.match(/(\d+)/);t.textContent=await latestEmails(Math.min(Number(m?.[1]||3),10));return}if(/(?:موعد|مواعيد|تقويم|جدولي)/i.test(q)){t.textContent=await upcomingEvents();return}if(/(?:جهات الاتصال|عملائي|العملاء|ارقام|أرقام)/i.test(q)){t.textContent=await contacts();return}if(/(?:drive|درايف|ملفاتي|الملفات)/i.test(q)){t.textContent=await driveFiles();return}}if(!user)throw Error('سجّل دخول Google أولاً.');const token=await user.getIdToken();const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message:q})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر الرد');t.textContent=d.reply||'تم.';if(d.mode==='voice'&&d.callId)startCallReport(d.callId)}catch(e){t.textContent=e.message}finally{send.disabled=false;chat.scrollTop=chat.scrollHeight}}const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));let reportPolling=false;async function startCallReport(callId){if(!callId||reportPolling)return;reportPolling=true;localStorage.setItem('dalilyPendingCall',callId);const reportMessage=add('بانتظار انتهاء المكالمة لإعداد التقرير…');try{for(let attempt=0;attempt<60;attempt++){await wait(attempt?7000:5000);if(!user)continue;const token=await user.getIdToken();const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({reportCallId:callId})});const data=await response.json();if(data.done){reportMessage.textContent=data.reply||'انتهت المكالمة.';localStorage.removeItem('dalilyPendingCall');return}}reportMessage.textContent='تأخر تقرير الاتصال. اكتب: وش صار في آخر مكالمة؟';}catch(error){reportMessage.textContent='تعذر تحديث تقرير الاتصال تلقائياً: '+error.message}finally{reportPolling=false}}gmailTest.onclick=()=>ask('اعرض آخر 3 رسائل في بريدي');calendarTest.onclick=()=>ask('اعرض مواعيدي القادمة');contactsTest.onclick=()=>ask('اعرض جهات الاتصال');driveTest.onclick=()=>ask('اعرض آخر ملفاتي في Drive');form.onsubmit=e=>{e.preventDefault();ask(input.value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));</script></body></html>
