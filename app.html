<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>Dalily</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#f6f8fb;color:#10233f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif}.app{height:100%;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:#fff}.top{padding:max(12px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #e2e8f0;background:#fff;flex:none}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#17335f,#071a35);color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px;position:relative}.logo:after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#54e62f;right:5px;bottom:5px}.titles strong{display:block;font-size:20px}.titles span{font-size:12px;color:#64748b}.state{font-size:12px;padding:7px 10px;border-radius:999px;background:#e7f6ef;color:#147a5a}.toolbar{display:flex;gap:7px;margin-top:9px;overflow-x:auto}.toolbar button,.toolbar a{flex:0 0 auto;border:1px solid #d9e2ec;background:#fff;color:#29445f;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:700;text-decoration:none}.chat{flex:1;min-height:0;overflow-y:auto;padding:14px;background:#f7f9fc;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;padding:11px 13px;border-radius:16px;line-height:1.6;white-space:pre-wrap;font-size:15px}.me{align-self:flex-start;background:#0d4d7f;color:#fff}.dalily{align-self:flex-end;background:#fff;border:1px solid #dfe7ef}.composer{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #e2e8f0;background:#fff}.composer textarea{height:50px;resize:none;border:1px solid #ccd8e4;border-radius:15px;padding:13px;font:inherit;font-size:16px}.composer button{height:50px;min-width:66px;border:0;border-radius:15px;background:#0d4d7f;color:#fff;font-weight:900}.loginbar{display:flex;align-items:center;gap:8px;margin-top:8px}.loginbar button{border:0;border-radius:10px;padding:7px 10px;font-weight:800}.login{background:#10233f;color:#fff}.logout{background:#eef2f6}.who{font-size:11px;color:#64748b}.welcome{margin:auto 0;text-align:center;color:#718096}.welcome b{display:block;color:#20364f;font-size:18px}
</style></head><body>
<main class="app"><header class="top"><div class="head"><div class="identity"><div class="logo">D</div><div class="titles"><strong>دليلي</strong><span>مدير أعمالك — محادثة مباشرة</span></div></div><div id="state" class="state">جاهز</div></div><div class="toolbar"><button data-q="عطني تقرير مدير الأعمال">تقرير المدير</button><button data-q="وش المهمة التالية؟">المهمة التالية</button><button data-q="وش المطلوب مني؟">المطلوب مني</button><a href="/manager.html">لوحة الإدارة</a><a href="/">الأعمال</a></div><div class="loginbar"><button id="login" class="login">دخول Google</button><button id="logout" class="logout" style="display:none">خروج</button><span id="who" class="who">سجّل الدخول مرة واحدة فقط</span></div></header><section id="chat" class="chat"><div class="welcome"><b>هلا، أنا دليلي</b>اكتب لي مباشرة وش تبي أنجز أو أتابع لك.</div></section><form id="form" class="composer"><textarea id="input" placeholder="اكتب لدليلي…"></textarea><button id="send">إرسال</button></form></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyB10M7V71N2aUgtNB_YutcpjSImAARwvJU',authDomain:'dalily-58eb0.firebaseapp.com',projectId:'dalily-58eb0',storageBucket:'dalily-58eb0.firebasestorage.app',messagingSenderId:'298067244494',appId:'1:298067244494:web:5ef23c58c73a986bf6a0a0'};
const auth=getAuth(initializeApp(firebaseConfig));
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});
const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send'),state=document.getElementById('state'),login=document.getElementById('login'),logout=document.getElementById('logout'),who=document.getElementById('who');
let user=null;
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
getRedirectResult(auth).catch(e=>add('تعذر تسجيل الدخول: '+e.message,'dalily'));
onAuthStateChanged(auth,u=>{user=u;login.style.display=u?'none':'block';logout.style.display=u?'block':'none';who.textContent=u?(u.email||'متصل'):'سجّل الدخول مرة واحدة فقط';state.textContent=u?'متصل':'جاهز'});
login.onclick=async()=>{try{login.disabled=true;login.textContent='جاري الدخول…';await signInWithRedirect(auth,provider)}catch(e){login.disabled=false;login.textContent='دخول Google';add('تعذر تسجيل الدخول: '+e.message,'dalily')}};
logout.onclick=()=>signOut(auth);
async function ask(q){if(!q.trim())return;add(q,'me');input.value='';send.disabled=true;const t=add('دليلي يجهز الرد…','dalily');try{if(!user)throw new Error('سجّل دخول Google أولاً.');const token=await user.getIdToken();const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message:q})});const data=await r.json();if(!r.ok)throw new Error(data.error||'تعذر الرد');t.textContent=data.reply||'تم.'}catch(e){t.textContent=e.message}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}}
form.onsubmit=e=>{e.preventDefault();ask(input.value)};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script></body></html>
