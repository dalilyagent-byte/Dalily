<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f2"><title>دليلي</title><!-- account-and-chat-fix-v2 --><style>@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap");*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#10253b;font-family:"Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:710px;margin:auto;min-height:100vh;background:#faf8f2;padding-bottom:95px}.head{padding:22px 20px 25px;background:linear-gradient(145deg,#e8efe9,#fbf5e9);border-bottom:1px solid #e6dfd4}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:950;color:#006d63}.back{width:43px;height:43px;border:1px solid #e5ded3;background:#fff;border-radius:50%;font-size:27px}.head h1{font-size:29px;margin:28px 0 5px}.head p{margin:0;color:#777}.content{padding:18px}.tools{display:flex;gap:10px}.primary,.secondary{height:52px;border-radius:15px;font-weight:800}.primary{flex:1;border:0;background:#006d63;color:#fff}.secondary{width:52px;border:1px solid #e4ddd2;background:#fff}.list{display:grid;gap:11px;margin-top:16px}.item,.empty{border:1px solid #e6dfd4;background:#fff;border-radius:18px;padding:17px}.item{display:flex;align-items:center;gap:12px}.item b{flex:1}.item button{border:0;background:#f6eeee;color:#a33;border-radius:10px;padding:8px}.empty{text-align:center;color:#777;padding:35px 18px;line-height:1.7}.account-card{border:1px solid #e6dfd4;background:#fff;border-radius:18px;padding:20px}.account-card h2{margin:0 0 7px}.account-card p{margin:4px 0;color:#777}.setting{width:100%;height:54px;margin-top:10px;border:1px solid #e6dfd4;background:#fff;border-radius:14px;text-align:right;padding:0 15px;font-weight:700}.ask{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:674px;height:58px;border:0;border-radius:18px;background:#102f3b;color:#fff;font-size:17px;font-weight:800}</style></head><body><main class="app"><header class="head"><div class="top"><div class="brand">دليلي</div><button class="back" onclick="location.href='/'">‹</button></div><h1 id="title"></h1><p id="desc"></p></header><section class="content"><div class="tools"><button class="primary" id="add"></button><button class="secondary" onclick="location.reload()">↻</button></div><div class="list" id="list"></div></section></main><button class="ask" id="ask">تكلم مع دليلي</button><script>
const cfg={tasks:['مهامي','المهام والمواعيد التي تسجلها في دليلي','إضافة مهمة','tasks'],opportunities:['فرص اليوم','نتائج البحث الفعلية عن الفرص المناسبة لك','ابدأ البحث عن فرصة','opportunities'],projects:['المشاريع','مشاريعك المسجلة وحالة كل مشروع','إضافة مشروع','projects'],clients:['العملاء','العملاء ومواعيد المتابعة','إضافة عميل','clients'],calls:['اتصال','تنفيذ الاتصالات ومراجعة نتائجها','بدء اتصال جديد','calls'],reports:['التقارير','ملخص مبني على بياناتك المسجلة','تحديث التقرير','reports'],alerts:['التنبيهات','التنبيهات الحقيقية المرتبطة بمهامك','تحديث التنبيهات','alerts'],account:['حسابي','بيانات الحساب وإعدادات دليلي','تعديل الحساب','account']};
const q=new URLSearchParams(location.search),key=q.get('view')||'tasks',v=cfg[key]||cfg.tasks;title.textContent=v[0];desc.textContent=v[1];add.textContent=v[2];document.title=v[0]+' | دليلي';
const storage='dalily_'+v[3],get=()=>JSON.parse(localStorage.getItem(storage)||'[]'),save=a=>localStorage.setItem(storage,JSON.stringify(a));
function render(){if(key==='account'){const name=localStorage.getItem('dalily_user_name')||'أبو بندر';list.innerHTML='<div class="account-card"><h2>'+name+'</h2><p>dalily.agent@gmail.com</p><p>حساب دليلي الشخصي</p></div><button class="setting" data-open="alerts">إعدادات التنبيهات ‹</button><button class="setting" data-open="chat">المحادثة مع دليلي ‹</button><button class="setting" data-open="home">العودة للرئيسية ‹</button>';return}const a=get();list.innerHTML=a.length?a.map((x,i)=>'<div class="item"><b>'+String(x).replace(/[<>]/g,'')+'</b><button data-del="'+i+'">حذف</button></div>').join(''):'<div class="empty">لا توجد بيانات مسجلة في هذا القسم حالياً.<br>لن يعرض دليلي أرقاماً أو معلومات غير مؤكدة.</div>'}render();
add.onclick=()=>{if(key==='account'){const n=prompt('اكتب الاسم الذي تريد ظهوره','أبو بندر');if(n){localStorage.setItem('dalily_user_name',n);render()}return}if(['opportunities','calls','reports','alerts'].includes(key)){location.href='/conversation.html?v=1&prompt='+encodeURIComponent(v[2]);return}const n=prompt(v[2]);if(!n)return;const a=get();a.unshift(n);save(a);render()};
list.onclick=e=>{const o=e.target.closest('[data-open]');if(o){if(o.dataset.open==='alerts')location.href='/section.html?view=alerts';if(o.dataset.open==='chat')location.href='/conversation.html?v=1';if(o.dataset.open==='home')location.href='/';return}const b=e.target.closest('[data-del]');if(!b)return;const a=get();a.splice(+b.dataset.del,1);save(a);render()};ask.onclick=()=>location.href='/conversation.html?v=1&prompt='+encodeURIComponent('ساعدني في قسم '+v[0]);
</script></body></html>
