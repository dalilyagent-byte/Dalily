<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfaf6"><title>دليلي</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#10253b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:710px;min-height:100vh;margin:auto;background:#fbfaf6;padding-bottom:90px}.head{height:145px;padding:22px 20px;background:linear-gradient(145deg,#e7eee9,#fbf5e9);border-bottom:1px solid #e8e1d7}.top{display:flex;align-items:center;justify-content:space-between}.back{width:43px;height:43px;border:1px solid #e4ddd2;background:#fff;border-radius:50%;font-size:28px}.brand{font-weight:950;font-size:25px;color:#073b42}.head h1{font-size:29px;margin:27px 0 0}.content{padding:18px}.summary{border:1px solid #e7e0d5;border-radius:22px;padding:20px;background:#fff;box-shadow:0 8px 22px rgba(40,40,34,.05)}.summary h2{margin:0;font-size:21px}.summary p{color:#74746f;line-height:1.7;margin:10px 0 0}.list{display:grid;gap:11px;margin-top:15px}.item{min-height:83px;border:1px solid #e8e1d7;background:#fff;border-radius:18px;padding:15px 17px;display:flex;align-items:center;gap:13px}.ico{width:46px;height:46px;border-radius:15px;background:#edf3ee;color:#00695f;display:grid;place-items:center;font-size:22px}.copy{flex:1}.copy b{display:block;font-size:17px}.copy small{display:block;color:#85847f;margin-top:7px}.go{color:#00695f;font-size:24px}.ask{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:674px;height:58px;border:0;border-radius:18px;background:#00695f;color:#fff;font-weight:800;font-size:17px;box-shadow:0 10px 24px rgba(0,76,67,.22)}</style></head><body><main class="app"><header class="head"><div class="top"><div class="brand">دليلي</div><button class="back" onclick="history.back()">‹</button></div><h1 id="title"></h1></header><section class="content"><div class="summary"><h2 id="lead"></h2><p id="desc"></p></div><div class="list" id="list"></div></section></main><button class="ask" id="ask">تكلم مع دليلي عن هذا القسم</button><script>
const data={
tasks:{title:'مهامي',lead:'مهامك في مكان واحد',desc:'تابع المهام اليومية والمواعيد ونسبة الإنجاز.',items:[['اليوم','المهام المطلوب إنجازها اليوم'],['قيد التنفيذ','المهام التي يعمل عليها دليلي'],['المواعيد','المواعيد والتذكيرات القادمة']]},
opportunities:{title:'فرص اليوم',lead:'أفضل الفرص المناسبة لك',desc:'يعرض دليلي الفرص ويدرسها قبل اقتراحها عليك.',items:[['فرص جديدة','فرص تم العثور عليها اليوم'],['قيد الدراسة','فرص يحللها دليلي الآن'],['المحفوظة','الفرص التي اخترتها للمتابعة']]},
projects:{title:'المشاريع',lead:'جميع مشاريعك',desc:'تابع كل مشروع وحالته والخطوة التالية.',items:[['دليلي','تطوير التطبيق والخدمات'],['لاونج 79','التصميم وخطة التنفيذ'],['مشروع جديد','ابدأ مشروعاً مع دليلي']]},
clients:{title:'العملاء',lead:'إدارة العملاء والمتابعات',desc:'سجل العملاء ونتائج التواصل ومواعيد المتابعة.',items:[['العملاء','قائمة العملاء المسجلين'],['المتابعات','المتابعات المطلوبة اليوم'],['إضافة عميل','أضف عميلاً جديداً']]},
calls:{title:'اتصال',lead:'دليلي يتصل نيابةً عنك',desc:'حدد الرقم والرسالة ثم تابع نتيجة الاتصال.',items:[['اتصال جديد','أدخل الرقم وما تريد قوله'],['سجل الاتصالات','راجع الاتصالات السابقة'],['تقارير الاتصال','الرد والنتيجة باختصار']]},
reports:{title:'التقارير',lead:'ملخص أعمالك',desc:'تقارير مختصرة عن المهام والمشاريع والعملاء.',items:[['تقرير اليوم','ما تم إنجازه اليوم'],['تقرير المشاريع','حالة جميع المشاريع'],['تقرير الاتصالات','نتائج اتصالات دليلي']]},
alerts:{title:'التنبيهات',lead:'آخر التنبيهات',desc:'كل ما يحتاج انتباهك أو قرارك.',items:[['مهام متأخرة','مهام تحتاج قرارك'],['متابعة عميل','موعد متابعة قريب'],['فرصة جديدة','فرصة مناسبة بانتظار المراجعة']]},
account:{title:'حسابي',lead:'إعدادات أبو بندر',desc:'إدارة بيانات الحساب وتفضيلات دليلي.',items:[['الملف الشخصي','بياناتك الأساسية'],['إعدادات دليلي','طريقة العمل والتنبيهات'],['الأمان','تسجيل الدخول والحماية']]}
};
const key=new URLSearchParams(location.search).get('view')||'tasks',v=data[key]||data.tasks;
document.title=v.title+' | دليلي';title.textContent=v.title;lead.textContent=v.lead;desc.textContent=v.desc;
list.innerHTML=v.items.map((x,i)=>'<button class="item" data-q="'+x[0]+'"><span class="ico">'+(i+1)+'</span><span class="copy"><b>'+x[0]+'</b><small>'+x[1]+'</small></span><span class="go">‹</span></button>').join('');
function chat(q){location.href='/chat.html?prompt='+encodeURIComponent(q)}
list.onclick=e=>{const b=e.target.closest('[data-q]');if(b)chat('اعرض '+b.dataset.q)};ask.onclick=()=>chat('ساعدني في قسم '+v.title);
</script></body></html>
