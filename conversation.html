<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#faf8f2"><title>المحادثة مع دليلي</title><style>@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap");:root{--ink:#10253b;--green:#006d63;--gold:#c99a31;--paper:#faf8f2;--line:#e8e1d6;--soft:#f3f1eb}*{box-sizing:border-box}html,body{margin:0;background:#f2efe8;color:var(--ink);font-family:"Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;height:100%}button,textarea{font:inherit}.app{max-width:710px;margin:auto;min-height:100dvh;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}.header{padding:18px 18px 12px;background:var(--paper);border-bottom:1px solid var(--line)}.top{display:grid;grid-template-columns:50px 1fr 50px;align-items:center}.round{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center;color:var(--green);box-shadow:0 4px 14px #443b2d12}.round svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9}.identity{text-align:center}.identity b{display:block;font-size:26px;font-weight:800;letter-spacing:-1px}.identity small{display:block;color:#8c8881;font-size:12px;margin-top:2px}.state{justify-self:end;min-width:48px;text-align:center;font-size:11px;color:var(--green);border:1px solid #b9d8d3;background:#fff;border-radius:999px;padding:7px 8px}.authbar{display:flex;align-items:center;gap:8px;margin-top:11px;min-height:26px}.authbar span{flex:1;color:#8b877f;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.authbar button{border:0;background:none;color:var(--green);font-size:12px;font-weight:700;padding:3px}.quick{display:flex;gap:8px;overflow:auto;padding:12px 18px 9px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:12px;box-shadow:0 2px 8px #443b2d0b}.chat{flex:1;overflow:auto;padding:8px 18px 18px;scroll-behavior:smooth}.msg{max-width:88%;padding:12px 14px;border-radius:18px;margin:9px 0;line-height:1.7;white-space:pre-wrap;font-size:15px;box-shadow:0 3px 12px #443b2d0c}.me{background:var(--green);color:#fff;margin-right:auto;border-bottom-right-radius:6px}.dalily{background:#fff;border:1px solid var(--line);margin-left:auto;border-bottom-left-radius:6px}.system{background:var(--soft);color:#68645e;border:1px solid var(--line)}.thinking{color:#8b877f}.composerWrap{padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,248,242,.2),var(--paper) 18%)}.composer{display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:25px;padding:7px 7px 7px 12px;box-shadow:0 8px 24px #443b2d17}.composer textarea{border:0;outline:0;resize:none;min-height:48px;max-height:120px;background:transparent;color:var(--ink);padding:12px 8px;font-size:15px}.composer textarea::placeholder{color:#aaa59d}.composer button{width:48px;height:48px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:20px;font-weight:800;display:grid;place-items:center}.composer button:disabled{opacity:.45}.note{text-align:center;color:#aaa59d;font-size:10px;margin-top:7px}.back{transform:rotate(180deg)}@media(max-width:420px){.header{padding-top:14px}.identity b{font-size:24px}.quick{padding-left:14px;padding-right:14px}.chat{padding-left:14px;padding-right:14px}.composerWrap{padding-left:14px;padding-right:14px}.msg{font-size:14px}}</style></head><body><main class="app"><header class="header"><div class="top"><button class="round" onclick="location.href='/'" aria-label="رجوع"><svg class="back" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><div class="identity"><b>دليلي</b><small>مدير أعمالك الذكي</small></div><div id="state" class="state">متصل</div></div><div class="authbar"><span id="who">جاري التحقق من الحساب...</span><button id="login">تسجيل الدخول</button><button id="logout" style="display:none">خروج</button></div></header><div class="quick"><button data-q="عطني تقرير مدير الأعمال">تقرير المدير</button><button data-q="وش نسبة إنجاز المشروع؟">نسبة الإنجاز</button><button data-q="وش المهمة التالية؟">المهمة التالية</button><button data-q="وش المطلوب مني؟">المطلوب مني</button></div><section id="chat" class="chat"><div class="msg dalily">هلا أبو بندر، أنا دليلي. وش تبي ننجز اليوم؟</div></section><div class="composerWrap"><form id="form" class="composer"><textarea id="input" placeholder="اكتب رسالتك لدليلي..." required></textarea><button id="send" aria-label="إرسال">↑</button></form><div class="note">دليلي ينفذ المهام المسموح بها داخل حسابك.</div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp,getDocs,query,orderBy,updateDoc,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyAJbfBSoquKOGBzmW8JzdtkuD97Nc10OYI',authDomain:'dalily-15fbb.firebaseapp.com',projectId:'dalily-15fbb',storageBucket:'dalily-15fbb.firebasestorage.app',messagingSenderId:'367242706687',appId:'1:367242706687:web:c94480475dff2385a496ca',measurementId:'G-1VT3HVTD3Y'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=x=>document.getElementById(x);let user=null,plan=null,opportunities=[],history=[];function add(role,text,cls=''){const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'dalily')+(cls?' '+cls:'');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}onAuthStateChanged(auth,u=>{user=u;$('login').style.display=u?'none':'inline-block';$('logout').style.display=u?'inline-block':'none';$('who').textContent=u?`مسجل: ${u.email||u.displayName||'الحساب'}`:'غير مسجل — سجل الدخول للتنفيذ داخل حسابك'});$('login').onclick=()=>signInWithPopup(auth,provider).catch(e=>add('assistant','تعذر تسجيل الدخول: '+e.message,'system'));$('logout').onclick=()=>signOut(auth);async function loadContext(){try{const[p,o]=await Promise.all([fetch('/execution-plan.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null),fetch('/opportunities.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)]);plan=p;opportunities=o?.items||[]}catch{}}loadContext();async function items(kind){const s=await getDocs(query(collection(db,'users',user.uid,kind),orderBy('createdAt','desc')));return s.docs.map(x=>({id:x.id,...x.data()}))}function findItem(a,q,field){q=q.toLowerCase();return a.find(x=>String(x[field]||'').toLowerCase().includes(q))}async function activeProjectData(){const ps=await items('projects');const p=ps.find(x=>x.status==='active')||ps[0];if(!p)return{project:null,tasks:[]};const ts=(await items('tasks')).filter(t=>t.projectId===p.id);return{project:p,tasks:ts}}async function runAction(a){if(!a)return null;if(!user)return'الطلب جاهز، لكن التنفيذ داخل الحساب يحتاج تسجيل الدخول بحساب Google أولاً.';if(a.type==='create_task'){await addDoc(collection(db,'users',user.uid,'tasks'),{title:a.title,projectId:'',done:false,createdAt:serverTimestamp(),source:'dalily-chat'});return`تم: أضفت المهمة «${a.title}».`}if(a.type==='create_project'){await addDoc(collection(db,'users',user.uid,'projects'),{name:a.name,createdAt:serverTimestamp(),source:'dalily-chat'});return`تم: أنشأت المشروع «${a.name}».`}if(a.type==='start_opportunity'){const existing=await items('projects');let p=findItem(existing,a.name,'name'),projectId=p?.id;if(!projectId){const ref=await addDoc(collection(db,'users',user.uid,'projects'),{name:a.name,status:'active',opportunityId:a.opportunityId||'',budget:a.budget||0,goal:a.goal||'',createdAt:serverTimestamp(),source:'dalily-opportunity'});projectId=ref.id}const current=await items('tasks'),created=[];for(const s of a.steps||[]){if(current.some(t=>t.projectId===projectId&&String(t.title||'')===s.title))continue;await addDoc(collection(db,'users',user.uid,'tasks'),{title:s.title,details:s.action||'',day:s.day||null,projectId,done:false,createdAt:serverTimestamp(),source:'dalily-plan'});created.push(s.title)}return`تم اعتماد «${a.name}» كمشروع فعلي.${created.length?` وأنشأت ${created.length} مهام تنفيذية مرتبطة به.`:' ومهامه موجودة مسبقاً، ما كررتها.'}`}if(a.type==='list_tasks'){const x=await items('tasks');return x.length?'مهامك الحالية:\n'+x.slice(0,15).map((t,i)=>`${i+1}. ${t.done?'✓':'○'} ${t.title}`).join('\n'):'ما عندك مهام حالياً.'}if(a.type==='list_projects'){const x=await items('projects');return x.length?'مشاريعك الحالية:\n'+x.slice(0,15).map((p,i)=>`${i+1}. ${p.name}`).join('\n'):'ما عندك مشاريع حالياً.'}if(a.type==='project_progress'){const{project,tasks}=await activeProjectData();if(!project)return'ما عندك مشروع نشط حالياً.';const done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;return`المشروع: ${project.name}\nالإنجاز: ${pct}% (${done} من ${total} مهمة)${project.goal?`\nالهدف: ${project.goal}`:''}`;}if(a.type==='next_task'){const{project,tasks}=await activeProjectData();if(!project)return'ما عندك مشروع نشط حالياً.';const open=tasks.filter(t=>!t.done).sort((a,b)=>(Number(a.day)||999)-(Number(b.day)||999));if(!open.length)return`مشروع «${project.name}» مكتمل حسب المهام الحالية.`;const t=open[0];return`المهمة التالية في «${project.name}»: ${t.title}${t.details?`\nالتنفيذ: ${t.details}`:''}`;}if(a.type==='owner_blockers'){const{project,tasks}=await activeProjectData();if(!project)return'ما عندك مشروع نشط حالياً.';const risky=tasks.filter(t=>!t.done&&/(شراء|دفع|تحويل|عقد|قرض|ميزانية|اعتماد|موافقة)/i.test(`${t.title||''} ${t.details||''}`));if(!risky.length)return`حالياً ما عندي شيء مسجل في «${project.name}» يحتاج موافقتك المالية أو القانونية. أكمل المهمة التالية.`;return'الأشياء التي تحتاج تدخلك:\n'+risky.slice(0,5).map((t,i)=>`${i+1}. ${t.title}`).join('\n');}if(a.type==='manager_report'){const ps=await items('projects'),ts=await items('tasks'),p=ps.find(x=>x.status==='active')||ps[0]||null,pt=p?ts.filter(t=>t.projectId===p.id):[],done=pt.filter(t=>t.done).length,total=pt.length,pct=total?Math.round(done/total*100):0,open=pt.filter(t=>!t.done).sort((a,b)=>(Number(a.day)||999)-(Number(b.day)||999)),blockers=open.filter(t=>/(شراء|دفع|تحويل|عقد|قرض|ميزانية|اعتماد|موافقة)/i.test(`${t.title||''} ${t.details||''}`)),best=plan||[...opportunities].sort((a,b)=>(Number(b?.score)||0)-(Number(a?.score)||0))[0]||null;let out='تقرير مدير الأعمال\n';out+=`المشاريع: ${ps.length} | المهام: ${ts.length} | المنجزة: ${ts.filter(t=>t.done).length}\n`;out+=p?`المشروع النشط: ${p.name}\nالإنجاز: ${pct}% (${done}/${total})\n`:'المشروع النشط: لا يوجد\n';out+=open[0]?`المهمة التالية: ${open[0].title}\n`:'المهمة التالية: لا توجد مهمة مفتوحة\n';out+=blockers.length?`يحتاج تدخلك: ${blockers[0].title}${blockers.length>1?` (+${blockers.length-1})`:''}\n`:'يحتاج تدخلك: لا يوجد شيء مسجل حالياً\n';out+=best?`أفضل فرصة حالية: ${best.name||'غير مسماة'}${best.score?` — ${best.score}/100`:''}`:'أفضل فرصة حالية: لا توجد بيانات كافية';return out;}if(a.type==='complete_task'||a.type==='delete_task'){const x=await items('tasks'),t=findItem(x,a.query,'title');if(!t)return`ما لقيت مهمة تطابق «${a.query}».`;if(a.type==='complete_task'){await updateDoc(doc(db,'users',user.uid,'tasks',t.id),{done:true,completedAt:serverTimestamp()});return`تم إنجاز المهمة «${t.title}».`}await deleteDoc(doc(db,'users',user.uid,'tasks',t.id));return`تم حذف المهمة «${t.title}».`}return null}async function sendMessage(q){q=q.trim();if(!q)return;add('user',q);history.push({role:'user',content:q});$('input').value='';$('send').disabled=true;$('state').textContent='يفكر...';const wait=add('assistant','دليلي يحلل الطلب...','thinking');try{if(!user)throw new Error('سجل الدخول أولاً ثم أرسل رسالتك');const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+await user.getIdToken()},body:JSON.stringify({message:q,history:history.slice(0,-1),context:{plan,opportunities}})}),data=await r.json();wait.remove();if(!r.ok)throw new Error(data.error||'تعذر الاتصال');add('assistant',data.reply||data.text||'تم استلام الطلب.');history.push({role:'assistant',content:data.reply||data.text||''});if(data.action){const done=await runAction(data.action);if(done)add('assistant',done,'system')}$('state').textContent=data.mode==='action'?'تنفيذ':data.mode==='ai'?'متصل':'جاهز'}catch(e){wait.remove();add('assistant','صار تعثر: '+e.message,'system');$('state').textContent='تعذر'}finally{$('send').disabled=false;$('input').focus()}}$('form').onsubmit=e=>{e.preventDefault();sendMessage($('input').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});</script></body></html>
