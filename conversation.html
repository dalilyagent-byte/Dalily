<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#faf8f2">
<title>المحادثة مع دليلي</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap");
:root{--ink:#10253b;--green:#006d63;--paper:#faf8f2;--line:#e8e1d6;--soft:#f3f1eb}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f2efe8;color:var(--ink);font-family:"Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,textarea{font:inherit}.app{max-width:710px;margin:auto;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}.header{padding:13px 17px 9px;border-bottom:1px solid var(--line);background:var(--paper);flex:none}.top{display:grid;grid-template-columns:46px 1fr 46px;align-items:center}.round{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center;color:var(--green);box-shadow:0 4px 14px #443b2d12}.round svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9}.identity{text-align:center}.identity b{display:block;font-size:25px;font-weight:800;letter-spacing:-1px}.identity small{display:block;color:#8c8881;font-size:11px;margin-top:1px}.state{justify-self:end;min-width:45px;text-align:center;font-size:10px;color:var(--green);border:1px solid #b9d8d3;background:#fff;border-radius:999px;padding:6px 7px}.authbar{display:flex;align-items:center;gap:8px;margin-top:7px;min-height:22px}.authbar span{flex:1;color:#8b877f;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.authbar button{border:0;background:none;color:var(--green);font-size:11px;font-weight:700;padding:2px}.quick{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:9px 15px 8px;scrollbar-width:none;flex:none;border-bottom:1px solid #eee9df}.quick::-webkit-scrollbar{display:none}.quick button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:11.5px;box-shadow:0 2px 8px #443b2d0b}.chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:13px 16px 10px;scroll-behavior:smooth;scroll-padding-block:14px}.msg{max-width:86%;padding:10px 13px;border-radius:17px;margin:7px 0;line-height:1.65;white-space:pre-wrap;font-size:14px;box-shadow:0 2px 9px #443b2d0a}.me{background:var(--green);color:#fff;margin-right:auto;border-bottom-right-radius:6px}.dalily{background:#fff;border:1px solid var(--line);margin-left:auto;border-bottom-left-radius:6px}.thinking{color:#8b877f;background:#fff;border:1px dashed var(--line);box-shadow:none}.system{display:inline-block;max-width:88%;padding:5px 9px;border-radius:999px;background:#f1efe9;color:#777168;border:0;box-shadow:none;font-size:10.5px;line-height:1.35;margin:3px 0 3px auto}.composerWrap{flex:none;padding:8px 15px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,248,242,.35),var(--paper) 20%)}.composer{display:grid;grid-template-columns:1fr 50px;gap:7px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:24px;padding:6px 7px 6px 11px;box-shadow:0 7px 22px #443b2d14}.composer textarea{border:0;outline:0;resize:none;min-height:44px;max-height:98px;background:transparent;color:var(--ink);padding:10px 7px;font-size:14px}.composer textarea::placeholder{color:#aaa59d}.composer button{width:44px;height:44px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:19px;font-weight:800;display:grid;place-items:center}.composer button:disabled{opacity:.45}.note{text-align:center;color:#aaa59d;font-size:9.5px;margin-top:5px}.back{transform:rotate(180deg)}
@media(max-width:420px){.header{padding-top:11px}.identity b{font-size:23px}.quick{padding-left:12px;padding-right:12px}.chat{padding-left:13px;padding-right:13px}.composerWrap{padding-left:13px;padding-right:13px}.msg{font-size:13.5px;max-width:90%}}
</style>
</head>
<body>
<main class="app">
<header class="header">
<div class="top">
<button class="round" onclick="location.href='/'" aria-label="رجوع"><svg class="back" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
<div class="identity"><b>دليلي</b><small>مدير أعمالك الذكي</small></div>
<div id="state" class="state">متصل</div>
</div>
<div class="authbar"><span id="who">جاري التحقق من الحساب...</span><button id="login">تسجيل الدخول</button><button id="logout" style="display:none">خروج</button></div>
</header>
<div class="quick">
<button data-q="عطني تقرير مدير الأعمال">تقرير المدير</button>
<button data-q="وش نسبة إنجاز المشروع؟">نسبة الإنجاز</button>
<button data-q="وش المهمة التالية؟">المهمة التالية</button>
<button data-q="وش المطلوب مني؟">المطلوب مني</button>
</div>
<section id="chat" class="chat"><div class="msg dalily">هلا أبو بندر، أنا دليلي. وش تبي ننجز اليوم؟</div></section>
<div class="composerWrap"><form id="form" class="composer"><textarea id="input" placeholder="اكتب رسالتك لدليلي..." required></textarea><button id="send" aria-label="إرسال">↑</button></form><div class="note">دليلي يجاوب على الاستفسارات، وينفذ فقط إذا طلبت منه أمر واضح.</div></div>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getFirestore,collection,addDoc,serverTimestamp,getDocs,query,orderBy,updateDoc,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const cfg={apiKey:'AIzaSyAJbfBSoquKOGBzmW8JzdtkuD97Nc10OYI',authDomain:'dalily-15fbb.firebaseapp.com',projectId:'dalily-15fbb',storageBucket:'dalily-15fbb.firebasestorage.app',messagingSenderId:'367242706687',appId:'1:367242706687:web:c94480475dff2385a496ca',measurementId:'G-1VT3HVTD3Y'};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=x=>document.getElementById(x);
let user=null,plan=null,opportunities=[],history=[];
function scrollChat(){requestAnimationFrame(()=>{$('chat').scrollTop=$('chat').scrollHeight})}
function add(role,text,cls=''){const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'dalily')+(cls?' '+cls:'');d.textContent=text;$('chat').appendChild(d);scrollChat();return d}
function addStatus(text){const d=add('assistant',text,'system');setTimeout(()=>{if(d.isConnected)d.remove()},4500);return d}
onAuthStateChanged(auth,u=>{user=u;$('login').style.display=u?'none':'inline-block';$('logout').style.display=u?'inline-block':'none';$('who').textContent=u?`مسجل: ${u.email||u.displayName||'الحساب'}`:'غير مسجل — سجل الدخول للتنفيذ داخل حسابك'});
$('login').onclick=()=>signInWithPopup(auth,provider).catch(e=>add('assistant','تعذر تسجيل الدخول: '+e.message));$('logout').onclick=()=>signOut(auth);
async function loadContext(){try{const[p,o]=await Promise.all([fetch('/execution-plan.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null),fetch('/opportunities.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)]);plan=p;opportunities=o?.items||[]}catch{}}loadContext();
async function items(kind){const s=await getDocs(query(collection(db,'users',user.uid,kind),orderBy('createdAt','desc')));return s.docs.map(x=>({id:x.id,...x.data()}))}
function findItem(a,q,field){q=String(q||'').toLowerCase();return a.find(x=>String(x[field]||'').toLowerCase().includes(q))}
async function activeProjectData(){const ps=await items('projects');const p=ps.find(x=>x.status==='active')||ps[0];if(!p)return{project:null,tasks:[]};const ts=(await items('tasks')).filter(t=>t.projectId===p.id);return{project:p,tasks:ts}}
async function runAction(a){
if(!a)return null;if(!user)return'التنفيذ يحتاج تسجيل الدخول بحساب Google أولاً.';
if(a.type==='create_task'){await addDoc(collection(db,'users',user.uid,'tasks'),{title:a.title,projectId:'',done:false,createdAt:serverTimestamp(),source:'dalily-chat'});return`تمت إضافة المهمة «${a.title}».`}
if(a.type==='create_project'){await addDoc(collection(db,'users',user.uid,'projects'),{name:a.name,status:'active',createdAt:serverTimestamp(),source:'dalily-chat'});return`تم إنشاء المشروع «${a.name}».`}
if(a.type==='start_opportunity'){const existing=await items('projects');let p=findItem(existing,a.name,'name'),projectId=p?.id;if(!projectId){const ref=await addDoc(collection(db,'users',user.uid,'projects'),{name:a.name,status:'active',opportunityId:a.opportunityId||'',budget:a.budget||0,goal:a.goal||'',createdAt:serverTimestamp(),source:'dalily-opportunity'});projectId=ref.id}const current=await items('tasks');let n=0;for(const s of a.steps||[]){if(current.some(t=>t.projectId===projectId&&String(t.title||'')===s.title))continue;await addDoc(collection(db,'users',user.uid,'tasks'),{title:s.title,details:s.action||'',day:s.day||null,projectId,done:false,createdAt:serverTimestamp(),source:'dalily-plan'});n++}return`تم اعتماد «${a.name}» كمشروع${n?` وإضافة ${n} مهام تنفيذية`:''}.`}
if(a.type==='list_tasks'){const x=await items('tasks');return x.length?'مهامك الحالية:\n'+x.slice(0,15).map((t,i)=>`${i+1}. ${t.done?'✓':'○'} ${t.title}`).join('\n'):'ما عندك مهام حالياً.'}
if(a.type==='list_projects'){const x=await items('projects');return x.length?'مشاريعك الحالية:\n'+x.slice(0,15).map((p,i)=>`${i+1}. ${p.name}`).join('\n'):'ما عندك مشاريع حالياً.'}
if(a.type==='project_progress'){const{project,tasks}=await activeProjectData();if(!project)return'ما عندك مشروع نشط حالياً.';const done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;return`المشروع: ${project.name}\nالإنجاز: ${pct}% (${done} من ${total} مهمة)`}
if(a.type==='next_task'){const{project,tasks}=await activeProjectData();if(!project)return'ما عندك مشروع نشط حالياً.';const open=tasks.filter(t=>!t.done).sort((a,b)=>(Number(a.day)||999)-(Number(b.day)||999));if(!open.length)return`مشروع «${project.name}» مكتمل حسب المهام الحالية.`;return`المهمة التالية في «${project.name}»: ${open[0].title}${open[0].details?`\n${open[0].details}`:''}`}
if(a.type==='owner_blockers'){const{project,tasks}=await activeProjectData();if(!project)return'ما عندك مشروع نشط حالياً.';const risky=tasks.filter(t=>!t.done&&/(شراء|دفع|تحويل|عقد|قرض|ميزانية|اعتماد|موافقة)/i.test(`${t.title||''} ${t.details||''}`));return risky.length?'يحتاج تدخلك:\n'+risky.slice(0,5).map((t,i)=>`${i+1}. ${t.title}`).join('\n'):`حالياً ما فيه شيء مسجل في «${project.name}» يحتاج موافقتك.`}
if(a.type==='manager_report'){const ps=await items('projects'),ts=await items('tasks'),p=ps.find(x=>x.status==='active')||ps[0]||null,pt=p?ts.filter(t=>t.projectId===p.id):[],done=pt.filter(t=>t.done).length,total=pt.length,pct=total?Math.round(done/total*100):0,open=pt.filter(t=>!t.done).sort((a,b)=>(Number(a.day)||999)-(Number(b.day)||999));let out=`تقرير مدير الأعمال\nالمشاريع: ${ps.length} | المهام: ${ts.length} | المنجزة: ${ts.filter(t=>t.done).length}\n`;out+=p?`المشروع النشط: ${p.name}\nالإنجاز: ${pct}% (${done}/${total})\n`:'المشروع النشط: لا يوجد\n';out+=open[0]?`المهمة التالية: ${open[0].title}`:'المهمة التالية: لا توجد مهمة مفتوحة';return out}
if(a.type==='complete_task'||a.type==='delete_task'){const x=await items('tasks'),t=findItem(x,a.query,'title');if(!t)return`ما لقيت مهمة تطابق «${a.query}».`;if(a.type==='complete_task'){await updateDoc(doc(db,'users',user.uid,'tasks',t.id),{done:true,completedAt:serverTimestamp()});return`تم إنجاز المهمة «${t.title}».`}await deleteDoc(doc(db,'users',user.uid,'tasks',t.id));return`تم حذف المهمة «${t.title}».`}
return null}
function genericExecutionText(text=''){return /(?:ينفذ|سأنفذ|راح أنفذ|جاري تنفيذ|تنفيذ الطلب|داخل دليلي)/i.test(text)&&text.length<120}
async function sendMessage(q){q=q.trim();if(!q)return;add('user',q);const prior=history.slice(-20);history.push({role:'user',content:q});$('input').value='';$('send').disabled=true;$('state').textContent='يفكر';const wait=add('assistant','دليلي يفكر...','thinking');try{const token=user?await user.getIdToken():'';const headers={'content-type':'application/json'};if(token)headers.authorization='Bearer '+token;const r=await fetch('/api/chat',{method:'POST',headers,body:JSON.stringify({message:q,history:prior,context:{plan,opportunities}})});const data=await r.json();wait.remove();if(!r.ok)throw new Error(data.error||'تعذر الاتصال');const reply=String(data.reply||data.text||'').trim();let actionResult=null;if(data.action&&data.mode!=='google-action'){actionResult=await runAction(data.action)}if(reply&&!genericExecutionText(reply)){add('assistant',reply);history.push({role:'assistant',content:reply})}if(actionResult){if(/^(?:تم|تمت|التنفيذ يحتاج)/.test(actionResult)&&actionResult.length<110)addStatus(actionResult);else add('assistant',actionResult);history.push({role:'assistant',content:actionResult})}if(!reply&&!actionResult){const fallback='تم استلام رسالتك.';add('assistant',fallback);history.push({role:'assistant',content:fallback})}$('state').textContent=data.mode==='action'||data.mode==='google-action'?'تنفيذ':'متصل'}catch(e){wait.remove();add('assistant','صار تعثر: '+e.message);$('state').textContent='تعذر الاتصال'}finally{$('send').disabled=false;$('input').focus();scrollChat()}}
$('form').onsubmit=e=>{e.preventDefault();sendMessage($('input').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
</script>
</body>
</html>
