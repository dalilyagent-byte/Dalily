<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خطة دليلي</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;background:#08111f;color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#0f1b2f;border:1px solid #22314b;border-radius:18px;padding:20px;margin:14px 0}.muted{color:#94a3b8;line-height:1.8}.score{font-size:42px;font-weight:900}.step{background:#0c1728;border:1px solid #22314b;border-radius:14px;padding:14px;margin:9px 0}.badge{display:inline-block;padding:6px 10px;border:1px solid #334155;border-radius:999px;color:#cbd5e1;margin:4px}.warn{background:#2b1d0e;border:1px solid #7c4a03;color:#fde68a}.btn{display:inline-block;padding:12px 16px;border-radius:12px;background:#fff;color:#0f172a;text-decoration:none;font-weight:800}</style></head><body><main class="wrap"><h1>خطة دليلي</h1><p class="muted">أفضل فرصة حالية وخطة اختبار عملية لمدة 7 أيام.</p><div id="app" class="card">جاري تحميل الخطة...</div><a class="btn" href="/">العودة إلى DALILY</a></main><script>fetch('/execution-plan.json?ts='+Date.now()).then(r=>r.json()).then(p=>{const s=p.steps.map(x=>`<div class="step"><b>اليوم ${x.day}: ${x.title}</b><div class="muted">${x.action}</div></div>`).join('');document.getElementById('app').innerHTML=`<div class="score">${p.score}/100</div><h2>${p.name}</h2><div><span class="badge">الميزانية: ${p.budget} ر.س</span><span class="badge">خطة 7 أيام</span></div><p class="muted"><b>لماذا اختارها دليلي؟</b><br>${p.why}</p><p class="muted"><b>العميل المستهدف:</b> ${p.targetCustomer}</p><p class="muted"><b>هدف أول 7 أيام:</b> ${p.goal7Days}</p><h3>خطوات التنفيذ</h3>${s}<div class="card warn"><b>قاعدة التوقف:</b><br>${p.stopRule}<br><br>أي شراء أو التزام مالي يحتاج موافقتك أولاً.</div>`}).catch(e=>document.getElementById('app').textContent='تعذر تحميل الخطة: '+e.message)</script></body></html>
