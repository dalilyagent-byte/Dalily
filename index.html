<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>دليلي</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.dalily{position:relative;width:100%;max-width:1024px;margin:auto;background:#fff}.dalily img{display:block;width:100%;height:auto}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#0b5c52;font-weight:800;z-index:999}.hotspot{position:absolute;border:0;background:transparent;padding:0;z-index:3}.trade{left:2.5%;top:23.8%;width:31%;height:16.7%}.business{left:34.5%;top:23.8%;width:31%;height:16.7%}.projects{left:66.5%;top:23.8%;width:31%;height:16.7%}.clients{left:2.5%;top:41%;width:31%;height:16.2%}.calls{left:34.5%;top:41%;width:31%;height:16.2%}.tasks{left:66.5%;top:41%;width:31%;height:16.2%}.chat{left:2.5%;top:84.3%;width:95%;height:7.3%}
</style>
</head><body>
<div id="loading" class="loading">جاري فتح دليلي…</div>
<main class="dalily"><img id="approved" alt="واجهة دليلي المعتمدة"><button class="hotspot trade" data-action="trade"></button><button class="hotspot business" data-action="business"></button><button class="hotspot projects" data-action="projects"></button><button class="hotspot clients" data-action="clients"></button><button class="hotspot calls" data-action="calls"></button><button class="hotspot tasks" data-action="tasks"></button><button class="hotspot chat" data-action="chat"></button></main>
<script>
function b64blob(b64,type){const bin=atob(b64);const chunks=[];for(let o=0;o<bin.length;o+=65536){const s=bin.slice(o,o+65536),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);chunks.push(a)}return new Blob(chunks,{type:type})}
(async()=>{try{const ps=['0','1a','1b','1c','1d','2a','2b','2c','2d','3','4','5','6'];let all='';for(const p of ps){const r=await fetch('/dalily-ref-'+p+'.txt?x=20260904-safari2',{cache:'no-store'});if(!r.ok)throw Error(p);all+=(await r.text()).trim()}const img=document.getElementById('approved');const url=URL.createObjectURL(b64blob(all,'image/webp'));img.onload=()=>{document.getElementById('loading').remove();URL.revokeObjectURL(url)};img.onerror=()=>{document.getElementById('loading').textContent='تعذر فتح الواجهة'};img.src=url}catch(e){document.getElementById('loading').textContent='تعذر فتح الواجهة'}})();
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const m={trade:'ابحث لي عن أفضل الفرص الاستثمارية',business:'اعرض مهامي اليومية ومتابعة التنفيذ',projects:'اعرض جميع مشاريعي',clients:'اعرض العملاء والمتابعات',calls:'اتصل على ',tasks:'اعرض المهام والمواعيد والتذكيرات',chat:''};location.href='/chat.html?prompt='+encodeURIComponent(m[b.dataset.action]||'')});
</script></body></html>
