<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f9f7f1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>دليلي</title>
<style>
:root{--ink:#10253b;--green:#00695f;--gold:#c7972d;--paper:#fbfaf6;--line:#e8e2d8}
*{box-sizing:border-box}
html,body{margin:0;background:#f3f1eb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button{font:inherit;color:inherit}
.app{width:100%;max-width:700px;min-height:100vh;margin:auto;background:var(--paper);padding-bottom:88px}
.hero{height:316px;position:relative;overflow:hidden;background:url('https://images.unsplash.com/photo-1674982046717-e5cc12a008dd?auto=format&fit=crop&fm=jpg&q=88&w=1400') center 52%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,246,.92) 0%,rgba(255,250,239,.50) 45%,rgba(250,247,239,.08) 78%,#fbfaf6 100%)}
.top,.brand,.hello{position:absolute;z-index:2}
.top{top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.circle{width:49px;height:49px;border-radius:50%;border:1px solid rgba(255,255,255,.94);background:rgba(255,255,255,.76);box-shadow:0 4px 15px rgba(20,35,43,.11);display:grid;place-items:center;font-size:22px}
.avatar{background:linear-gradient(145deg,#fff,#e6e0d4);font-size:24px}
.notify{position:relative;color:var(--green)}
.notify:after{content:"";position:absolute;top:1px;right:2px;width:9px;height:9px;background:var(--gold);border-radius:50%;border:2px solid #fff}
.brand{top:29px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.brand b{display:block;font-size:42px;line-height:.9;font-weight:950;color:#0c3242;letter-spacing:-3px}
.brand small{display:block;font-size:9px;letter-spacing:7px;margin-top:8px;color:#315266}
.brand span{display:block;font-size:14px;color:#17655f;margin-top:12px;font-weight:600}
.hello{top:126px;right:24px;text-align:right}
.hello b{font-size:21px}.hello p{margin:8px 0 0;font-size:28px;font-weight:850}
.command{position:relative;z-index:3;margin:-70px 18px 20px;height:92px;width:calc(100% - 36px);border:8px solid rgba(255,255,255,.7);border-radius:34px;background:#fff;box-shadow:0 14px 34px rgba(46,47,42,.13);display:flex;align-items:center;padding:0;overflow:hidden;text-align:right}
.spark{width:70px;height:76px;background:var(--green);color:#fff;display:grid;place-items:center;border-radius:26px;margin:0 0 0 10px;font-size:25px}
.command-copy{flex:1;padding:0 13px}.command-copy b{display:block;font-size:21px}.command-copy span{display:block;color:#aaa5a0;font-size:15px;margin-top:7px}.mic{width:54px;color:var(--green);font-size:24px;text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.action{height:82px;border:1px solid var(--line);background:#fff;border-radius:18px;display:flex;align-items:center;padding:0 17px;box-shadow:0 3px 10px rgba(37,37,31,.025);text-align:right}
.action .ico{width:42px;color:var(--green);font-size:27px;text-align:center}.action b{font-size:18px;flex:1;margin-right:9px}.action .go{font-size:22px;color:#183142}
.panel{margin:18px;background:#fff;border:1px solid var(--line);border-radius:23px;box-shadow:0 8px 22px rgba(45,42,34,.06);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}.panel-head h2{font-size:23px;margin:0}.panel-head span{font-size:14px;color:var(--green)}
.opportunity{padding:10px 20px 18px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.deal-icon{width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;position:relative}
.deal-icon:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);top:0;right:0}
.deal b{font-size:18px}.deal p{margin:7px 0;color:#777;font-size:13px}
.metrics{border-top:1px solid #eee9df;display:grid;grid-template-columns:repeat(3,1fr);padding:14px 5px}.metric{text-align:center;border-left:1px solid #eee9df}.metric:last-child{border:0}.metric small{display:block;color:#8b8985;font-size:11px}.metric b{display:block;margin-top:6px;font-size:14px;color:#18344d}
.taskbox{padding:0 20px 20px}.taskrow{display:flex;align-items:center;gap:14px}.task-symbol{width:52px;height:52px;border-radius:15px;background:#edf2ea;color:var(--green);display:grid;place-items:center;font-size:25px}.progress{flex:1}.progress b{font-size:15px}.bar{height:8px;background:#eeeae2;border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;width:67%;height:100%;background:var(--green);border-radius:9px}
.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:700px;height:82px;background:rgba(255,255,255,.96);border-top:1px solid #e5e1d9;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:transparent;font-size:12px;color:#676767}.nav .nicon{display:block;font-size:25px;margin-bottom:4px}.nav .active{color:var(--green);font-weight:800}
@media(max-width:390px){.hero{height:292px}.brand b{font-size:36px}.brand span{font-size:12px}.hello{top:119px}.hello p{font-size:25px}.command{margin-top:-64px;height:86px}.spark{height:70px}.action{height:76px}.action b{font-size:16px}.panel{margin:15px 18px}}
</style>
</head>
<body>
<main class="app">
<header class="hero">
  <div class="top"><button class="circle notify" data-prompt="اعرض التنبيهات">♧</button><button class="circle avatar" data-prompt="اعرض حسابي">♙</button></div>
  <div class="brand"><b>دليلي</b><small>DALILY</small><span>مدير أعمالك الذكي</span></div>
  <div class="hello"><b>هلا أبو بندر⌄</b><p>وش ننجز اليوم؟</p></div>
</header>
<button class="command" data-prompt=""><span class="spark">✦</span><span class="command-copy"><b>وش ننجز اليوم؟</b><span>اسأل دليلي أو أعطه مهمة</span></span><span class="mic">♩</span></button>
<section class="quick">
 <button class="action" data-prompt="اعرض مهامي"><span class="ico">☷</span><b>مهامي</b><span class="go">‹</span></button>
 <button class="action" data-prompt="ابحث لي عن أفضل فرص اليوم"><span class="ico">↗</span><b>فرص اليوم</b><span class="go">‹</span></button>
 <button class="action" data-prompt="اعرض العملاء والمتابعات"><span class="ico">♧</span><b>العملاء</b><span class="go">‹</span></button>
 <button class="action" data-prompt="اعرض جميع مشاريعي"><span class="ico">▣</span><b>المشاريع</b><span class="go">‹</span></button>
 <button class="action" data-prompt="اعرض التقارير"><span class="ico">▥</span><b>التقارير</b><span class="go">‹</span></button>
 <button class="action" data-prompt="اتصل على "><span class="ico">⌕</span><b>اتصال</b><span class="go">‹</span></button>
</section>
<section class="panel">
 <div class="panel-head"><h2>فرص اليوم</h2><span>عرض الكل ‹</span></div>
 <div class="opportunity"><div class="deal-icon">◇</div><div class="deal"><b>3 فرص جديدة بانتظارك</b><p>اضغط هنا ليبحث دليلي ويعرض أفضل الفرص المناسبة لك</p></div></div>
 <div class="metrics"><div class="metric"><small>احتمالية النجاح</small><b>72%</b></div><div class="metric"><small>أفضل فرصة</small><b>قابلة للتنفيذ</b></div><div class="metric"><small>رأس المال</small><b>أقل من 1000 ر.س</b></div></div>
</section>
<section class="panel">
 <div class="panel-head"><h2>مهامي</h2><span>عرض الكل ‹</span></div>
 <div class="taskbox"><div class="taskrow"><div class="task-symbol">☷</div><div class="progress"><b>12 من 18 مهمة مكتملة</b><div class="bar"><i></i></div></div><strong>67%</strong></div></div>
</section>
</main>
<nav class="nav">
 <button class="active"><span class="nicon">⌂</span>الرئيسية</button>
 <button data-prompt=""><span class="nicon">◯</span>المحادثة</button>
 <button data-prompt="اعرض التنبيهات"><span class="nicon">♧</span>التنبيهات</button>
 <button data-prompt="اعرض حسابي"><span class="nicon">♙</span>حسابي</button>
</nav>
<script>
document.addEventListener('click',e=>{const b=e.target.closest('[data-prompt]');if(!b)return;location.href='/chat.html?prompt='+encodeURIComponent(b.dataset.prompt||'')});
</script>
</body></html>
