<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#faf8f2"><title>دليلي</title><style>
:root{--ink:#10253b;--green:#006d63;--gold:#c99a31;--paper:#faf8f2;--line:#e8e1d6}*{box-sizing:border-box}html,body{margin:0;background:#f2efe8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button{font:inherit;color:inherit}.app{max-width:710px;margin:auto;min-height:100vh;background:var(--paper);padding-bottom:88px}.hero{height:375px;position:relative;background:url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=1400&q=90') center 58%/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,247,.9),rgba(255,250,238,.25) 70%,var(--paper))}.top,.brand,.hello{position:absolute;z-index:2}.top{top:18px;left:20px;right:20px;display:flex;justify-content:space-between}.round{width:48px;height:48px;border:1px solid #fff;background:rgba(255,255,255,.85);border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 14px #0002;color:var(--green)}.round svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}.brand{top:22px;left:50%;transform:translateX(-50%);text-align:center}.brand b{font-size:42px;font-weight:950;letter-spacing:-3px}.brand small{display:block;letter-spacing:6px;font-size:9px}.brand span{display:block;margin-top:12px;color:var(--green);font-size:14px}.hello{right:24px;top:135px}.hello b{font-size:18px}.hello h1{font-size:29px;margin:15px 0}.command{position:relative;z-index:3;margin:-83px 28px 30px;width:calc(100% - 56px);height:126px;border:9px solid #ffffffb5;border-radius:42px;background:#fff;display:flex;align-items:center;box-shadow:0 13px 30px #443b2d24;padding:0;overflow:hidden}.spark{height:108px;width:103px;border-radius:31px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:32px}.cmdcopy{flex:1;text-align:right;padding:0 22px}.cmdcopy b{display:block;font-size:24px}.cmdcopy span{display:block;color:#aaa5a0;font-size:16px;margin-top:9px}.mic{width:55px;color:var(--green);font-size:24px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 28px}.action{height:88px;border:1px solid var(--line);background:#fff;border-radius:18px;display:flex;align-items:center;padding:0 18px}.action svg{width:31px;height:31px;fill:none;stroke:var(--green);stroke-width:1.8}.action b{flex:1;margin-right:13px;font-size:18px}.go{font-size:25px}.panel{margin:22px 28px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 20px #443b2d12;padding:20px}.phead{display:flex;justify-content:space-between;align-items:center}.phead h2{margin:0;font-size:25px}.phead a{color:var(--green);font-size:14px;text-decoration:none}.empty{padding:27px 5px 15px;text-align:center}.empty b{font-size:18px}.empty p{color:#898680;font-size:14px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.count{text-align:center;background:#f6f5f0;border-radius:14px;padding:12px 4px}.count strong{display:block;font-size:22px;color:var(--green)}.count small{font-size:11px;color:#777}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:710px;width:100%;height:80px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:9}.nav button{border:0;background:none;font-size:12px}.nav span{display:block;font-size:24px;margin-bottom:4px}.active{color:var(--green);font-weight:800}@media(max-width:420px){.hero{height:315px}.brand b{font-size:36px}.hello{top:120px}.hello h1{font-size:26px}.command{margin:-65px 18px 24px;width:calc(100% - 36px);height:102px;border-radius:36px}.spark{height:86px;width:82px}.cmdcopy{padding:0 13px}.cmdcopy b{font-size:21px}.cmdcopy span{font-size:14px}.quick{padding:0 18px}.action{height:78px;padding:0 14px}.action b{font-size:16px}.panel{margin:18px}}
</style></head><body><main class="app"><header class="hero"><div class="top"><button class="round" data-view="alerts" aria-label="التنبيهات"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><button class="round" data-view="account" aria-label="حسابي"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 3.5-7 8-7s7 2 8 7"/></svg></button></div><div class="brand"><b>دليلي</b><small>DALILY</small><span>مدير أعمالك الذكي</span></div><div class="hello"><b>هلا أبو بندر⌄</b><h1>وش ننجز اليوم؟</h1></div></header><button class="command" data-chat=""><span class="spark">✦</span><span class="cmdcopy"><b>وش ننجز اليوم؟</b><span>اسأل دليلي أو أعطه مهمة</span></span><span class="mic">♩</span></button><section class="quick" id="quick"></section><section class="panel"><div class="phead"><h2>ملخص دليلي</h2><a href="/section.html?view=reports">عرض الكل ‹</a></div><div class="empty" id="empty"><b>لا توجد بيانات مسجلة حالياً</b><p>أضف مهامك ومشاريعك وعملاءك، وسيظهر الملخص هنا تلقائياً.</p></div><div class="counts"><div class="count"><strong id="tc">0</strong><small>مهام</small></div><div class="count"><strong id="pc">0</strong><small>مشاريع</small></div><div class="count"><strong id="cc">0</strong><small>عملاء</small></div></div></section></main><nav class="nav"><button class="active"><span>⌂</span>الرئيسية</button><button data-chat=""><span>◯</span>المحادثة</button><button data-view="alerts"><span>♧</span>التنبيهات</button><button data-view="account"><span>♙</span>حسابي</button></nav><script>
const icons={tasks:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="m8 9 1 1 2-2m2 1h3m-8 5 1 1 2-2m2 1h3"/></svg>',opportunities:'<svg viewBox="0 0 24 24"><path d="M4 19V9m6 10v-6m6 6V7m-9-2h12v12"/><path d="m7 12 4-4 3 2 5-5"/></svg>',projects:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3m-13 5h18"/></svg>',clients:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6m1-5c3 0 4.5 1.7 5 5"/></svg>',calls:'<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2c1 3 3 5 6 6l2-3 5 2v4c0 2-2 3-4 2C9 19 5 15 3 7c-1-2 0-4 2-4Z"/></svg>',reports:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 17v-4m4 4V8m4 9v-6"/></svg>'};
const acts=[['opportunities','فرص اليوم'],['tasks','مهامي'],['projects','المشاريع'],['clients','العملاء'],['calls','اتصال'],['reports','التقارير']];
quick.innerHTML=acts.map(x=>'<button class="action" data-view="'+x[0]+'">'+icons[x[0]]+'<b>'+x[1]+'</b><span class="go">‹</span></button>').join('');
const get=k=>JSON.parse(localStorage.getItem('dalily_'+k)||'[]');tc.textContent=get('tasks').length;pc.textContent=get('projects').length;cc.textContent=get('clients').length;
document.onclick=e=>{const v=e.target.closest('[data-view]'),c=e.target.closest('[data-chat]');if(v)location.href='/section.html?view='+v.dataset.view;if(c)location.href='/chat.html'};
</script></body></html>
